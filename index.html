<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HOLLOW//ZERO</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
<style>:root{--bg:#080B10;--bg2:#0D131C;--pn:#111923;--el:#172330;--bd:#253442;--ac:#37D7F2;--ac2:#65A9FF;--cr:#FF4545;--wn:#FFB547;--ok:#54D69A;--of:#63778A;--tx:#ECF3F9;--t2:#8FA3B5;--t3:#63778A}
*{box-sizing:border-box;margin:0}body{background:var(--bg);color:var(--tx);font:14px 'Space Grotesk',sans-serif;height:100vh;overflow:hidden;background-image:linear-gradient(#ffffff06 1px,transparent 1px),linear-gradient(90deg,#ffffff06 1px,transparent 1px);background-size:32px 32px}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(transparent 0 2px,#0000002e 2px 3px);z-index:99}
#app{display:grid;grid-template:26px 56px 1fr/220px 1fr;height:100vh}
#hdr{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;background:var(--bg2);border-bottom:1px solid var(--bd)}
.logo{font-weight:700;letter-spacing:.12em;font-size:18px;color:var(--ac)}.sub,.mono,.sm{font:11px 'JetBrains Mono',monospace;color:var(--t2)}.hc{text-align:center}.hr{display:flex;gap:12px;align-items:center}
#nav{background:var(--bg2);border-right:1px solid var(--bd);padding:10px 0;overflow:auto;display:flex;flex-direction:column}
#nav button{display:flex;gap:10px;align-items:center;background:none;border:0;border-left:3px solid transparent;color:var(--t2);padding:11px 16px;text-align:left;font:600 12px 'Space Grotesk';letter-spacing:.08em;cursor:pointer;transition:.2s}
#nav button:hover{background:var(--pn);color:var(--tx)}#nav button.on{border-color:var(--ac);color:var(--ac);background:linear-gradient(90deg,#37D7F218,transparent)}
#nav svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8}.ns{margin-top:auto;padding:12px 16px;border-top:1px solid var(--bd)}
main{overflow:auto;padding:18px;animation:fi .3s}@keyframes fi{from{opacity:0;transform:translateY(6px)}}
h1{font-size:22px;letter-spacing:.1em}h1+p{color:var(--t2);margin:2px 0 14px}
.g{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));margin-bottom:12px}.g6{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.pn{background:var(--pn);border:1px solid var(--bd);padding:12px;position:relative}.pn::before{content:"";position:absolute;left:-1px;top:-1px;width:10px;height:10px;border:solid var(--ac);border-width:2px 0 0 2px}
.pn h3{font:600 11px 'JetBrains Mono';letter-spacing:.14em;color:var(--t2);margin-bottom:8px}
.big{font:600 28px 'JetBrains Mono'}.sp{width:100%;height:28px}.lg{height:60px}
.ok{color:var(--ok);background:var(--ok)}.wn{color:var(--wn);background:var(--wn)}.cr{color:var(--cr);background:var(--cr)}.of{color:var(--of);background:var(--of)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;animation:pl 1.6s infinite}.cr.dot{animation-duration:.7s}@keyframes pl{50%{opacity:.35}}
.br{position:relative;display:flex;justify-content:space-between;padding:4px 0 9px;font-size:12px;color:var(--t2)}.br b{font-family:'JetBrains Mono';color:var(--tx)}.br i{position:absolute;left:0;bottom:3px;height:3px;transition:width .8s}
.ban{border:1px solid var(--cr);background:#ff45450f;padding:10px 14px;margin-bottom:12px;font:12px 'JetBrains Mono';display:flex;gap:20px;flex-wrap:wrap}
button.b,select,input,textarea{background:var(--el);color:var(--tx);border:1px solid var(--bd);padding:8px 12px;font:600 11px 'JetBrains Mono';letter-spacing:.06em;cursor:pointer}
button.b:hover{border-color:var(--ac);box-shadow:0 0 10px #37D7F233}button.b.d{border-color:var(--cr);color:var(--cr)}button.b.p{border-color:var(--ac);color:var(--ac)}
textarea,input{width:100%;cursor:text;font-weight:400}.bs{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
table{width:100%;border-collapse:collapse;font:12px 'JetBrains Mono'}td,th{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--t3)}
.row{border-bottom:1px solid var(--bd);padding:5px 0;font:11px 'JetBrains Mono';color:var(--t2)}.row b{color:var(--tx)}
svg text{font:10px 'JetBrains Mono';fill:var(--t2)}.nd{cursor:pointer}.nd:hover circle{stroke:#fff}.map{width:100%;background:var(--bg2);border:1px solid var(--bd)}
.tl{display:flex;gap:6px;flex-wrap:wrap}.tl span{border:1px solid var(--bd);padding:4px 8px;font:11px 'JetBrains Mono';color:var(--t3)}.tl .dn{color:var(--ok);border-color:var(--ok)}
#toasts{pointer-events:none;position:fixed;right:12px;top:64px;width:320px;z-index:100;display:flex;flex-direction:column;gap:6px}
.ts{pointer-events:auto;background:var(--pn);border:1px solid var(--bd);border-left:4px solid;padding:8px 10px;font:11px 'JetBrains Mono';display:flex;justify-content:space-between;gap:8px;animation:fi .3s}
.ts.CRITICAL{border-color:var(--cr);box-shadow:0 0 14px #ff454544}.ts.WARNING{border-color:var(--wn)}.ts.INFORMATION{border-color:var(--ac2)}.ts.SUCCESS{border-color:var(--ok)}.ts button{background:none;border:0;color:var(--t2);cursor:pointer}
.demo{border:1px solid var(--wn);color:var(--wn);padding:2px 6px;font:10px 'JetBrains Mono'}.bell{position:relative;cursor:pointer}.bell em{position:absolute;top:-6px;right:-8px;background:var(--cr);font:10px 'JetBrains Mono';padding:0 4px;border-radius:8px;font-style:normal}
@media(max-width:800px){#app{grid-template:26px 56px 48px 1fr/1fr}#tk{grid-column:1!important}#nav{flex-direction:row;border:0;padding:0}.ns,.hc{display:none}#nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent;padding:12px}#nav button.on{border-bottom-color:var(--ac)}#hdr{grid-column:1}}

#tk{grid-column:1/3;display:flex;background:#1a0a0c;border-bottom:1px solid var(--cr);overflow:hidden;align-items:center}
#tk .tg{background:var(--cr);color:#000;padding:5px 10px;font:700 11px 'JetBrains Mono';white-space:nowrap;z-index:2;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:.25}}
#tk .tw{flex:1;overflow:hidden}#tk .tt{display:inline-block;white-space:nowrap;font:11px 'JetBrains Mono';color:var(--wn);animation:mq 75s linear infinite}@keyframes mq{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
.cls{border:2px solid var(--cr);color:var(--cr);display:inline-block;padding:2px 10px;font:700 12px 'JetBrains Mono';letter-spacing:.2em;transform:rotate(-1.5deg);margin-bottom:10px}

const SC={HEALTHY:'ok',WARNING:'wn',CRITICAL:'cr',OFFLINE:'of'};
const HEX={ok:'#54D69A',wn:'#FFB547',cr:'#FF4545',of:'#63778A'};
const spark=(a,c='#37D7F2')=>{const mn=Math.min(...a),mx=Math.max(...a,mn+1);return `<svg class="sp" viewBox="0 0 120 28" preserveAspectRatio="none"><polyline fill="none" stroke="${c}" stroke-width="1.5" points="${a.map((v,i)=>(i/(a.length-1)*120).toFixed(1)+','+(26-(v-mn)/(mx-mn)*24).toFixed(1)).join(' ')}"/></svg>`};
const bar=(l,v,u='%')=>`<div class="br"><span>${l}</span><b>${v.toFixed(1)}${u}</b><i class="${col(v)}" style="width:${clamp(v)}%"></i></div>`;
const P=(t,b,c='')=>`<section class="pn ${c}"><h3>${t}</h3>${b}</section>`;
const H=(t,s)=>`<h1>${t}</h1><p>${s}</p>`;
const SIMNOTE='<p class="sm">SIMULATED ESTIMATES — FICTIONAL DATA.</p>';
const btn=(a,l,c='')=>`<button class="b ${c}" data-a="${a}">${l}</button>`;

function metric(l,v,k,u='%',dec=1){const x=S.hist[k]||[v];const tr=x[x.length-1]-x[Math.max(0,x.length-10)];const c=col(v);
 return `<div class="pn"><h3>${l}</h3><div class="big">${v.toFixed(dec)}${u}</div><div class="sm"><i class="dot ${c}"></i>${c==='ok'?'NOMINAL':c==='wn'?'DEGRADED':'CRITICAL'} ${tr>0.2?'▲':tr<-0.2?'▼':'■'} ${tr.toFixed(1)}</div>${spark(x,HEX[c])}</div>`}

function mapSvg(opt={}){
 const u=S.ui,f=opt.mini?'all':u.filter,z=opt.mini?1:u.zoom,D=S.districts;
 const V=d=>({power:d.pw,oxygen:d.ox,water:d.wa,network:d.net}[f]),cl=d=>f==='all'?SC[d.st]:col(V(d));
 let s=`<svg class="map" viewBox="${400-400/z} ${250-250/z} ${800/z} ${500/z}">`;
 if(opt.mini||u.links)LINKS.forEach(([a,b])=>{const A=D[a],B=D[b];const bad=f==='all'?(A.pw<40||B.pw<40):Math.min(V(A),V(B))<40,iso=f==='all'?(A.net<=0||B.net<=0):false,amb=f!=='all'&&!bad&&Math.min(V(A),V(B))<70;
  s+=`<line x1="${A.x}" y1="${A.y}" x2="${B.x}" y2="${B.y}" stroke="${bad?'#FF4545':amb?'#FFB547':iso?'#63778A':'#37D7F2'}" stroke-opacity=".5" stroke-width="1.5" ${bad||iso?'stroke-dasharray="5 4"':''}/>`});
 D.forEach(d=>{const c=cl(d),r=u.dens&&!opt.mini?8+d.pop/18:16;
  s+=`<g class="nd" data-a="sel:${d.i}"><circle cx="${d.x}" cy="${d.y}" r="${r+7}" fill="none" stroke="${HEX[c]}" stroke-opacity=".3"/><circle cx="${d.x}" cy="${d.y}" r="${r}" fill="${HEX[c]}22" stroke="${HEX[c]}" stroke-width="2"/><text x="${d.x}" y="${d.y+3}" text-anchor="middle" style="fill:#ECF3F9">${d.id}</text><text x="${d.x}" y="${d.y+r+20}" text-anchor="middle">${d.name}</text>${f!=='all'&&!opt.mini?`<text x="${d.x}" y="${d.y+r+32}" text-anchor="middle" style="fill:${HEX[c]};font-weight:700">${f.toUpperCase()} ${Math.round(V(d))}%</text>`:''}</g>`});
 return s+'</svg>'}

function havenPanel(){
 const c=S.cd,h=S.hv.find(x=>x.k===S.ui.hv),tg=S.hv.find(x=>x.k===(c.active?c.target:(S.ui.hv||'red')));
 const lights=S.hv.map(v=>{const c2=v.dark?'#3a4350':v.c,sel=S.ui.hv===v.k,fl=c.active&&c.target===v.k&&c.rem<=20;
  return `<g class="nd ${fl?'fl':''}" style="--d:${Math.max(.12,c.rem/45*.8).toFixed(2)}s" data-a="hv:${v.k}">${v.dark?`<circle cx="${v.x}" cy="${v.y}" r="40" fill="#0c0a1c" opacity=".95" filter="url(#gl)"/>`:`<circle cx="${v.x}" cy="${v.y}" r="26" fill="${c2}" opacity=".45" filter="url(#gl)"/>`}<circle cx="${v.x}" cy="${v.y}" r="${sel?30:24}" fill="${c2}" fill-opacity="${v.dark?.06:.15}" stroke="${c2}" stroke-width="${sel?3:2}"/><text x="${v.x}" y="${v.y+(v.y>500?-34:42)}" text-anchor="middle" style="fill:#fff;font-size:13px;paint-order:stroke;stroke:#000;stroke-width:3px">${v.name}${v.dark?' // DARK':''}</text></g>`}).join('');
 const st=c.active?'ARMED':tg.dark?'COLLAPSED':c.result==='diverted'?'DIVERTED':'STANDBY';
 const detail=h?`<div class="row"><b style="color:${h.c}">${h.name}</b> · DISTRICT ${pad(h.d+1)}</div>${h.dark?'<p class="cr" style="background:none">HAVEN DARK — SHIELD OFFLINE</p>':bar('SHIELD INTEGRITY',h.shield)}<div class="row">POPULATION <b>${h.pop}M</b> (SIMULATED)</div>`:'<p class="sm">CLICK A GLOWING HAVEN TO INSPECT.</p>';
 return P('GLOBAL HAVEN MONITOR',`<div class="g" style="grid-template-columns:2fr 1fr;margin:0"><div class="hvw"><svg viewBox="0 0 1024 576" preserveAspectRatio="none" style="width:100%;height:100%;display:block"><defs><filter id="gl"><feGaussianBlur stdDeviation="6"/></filter></defs>${lights}</svg></div><div>${detail}<div class="pn" style="margin-top:10px;border-color:${c.active?'var(--cr)':'var(--bd)'}"><h3>SHIELD COLLAPSE COUNTDOWN // ${tg.name}</h3><div class="big ${c.active?'cr':tg.dark?'of':c.result==='diverted'?'ok':''}" style="background:none">00:${pad(c.rem)}</div><div class="sm">${st} · SHIELD ${tg.shield.toFixed(0)}%</div><div class="bs">${btn('arm','ARM ON '+tg.name,'d')}${btn('divert','DIVERT RESERVE POWER','p')}${btn('relight','RELIGHT '+tg.name)}</div><p class="sm">Divert needs &gt;75% grid power and active comms. Select any haven, then arm. Failure darkens it and cascades into neighbors. ${SIMNOTE}</p></div></div></div>`)}
function command(){
 const i=S.infra,D=S.districts,bad=D.filter(d=>d.st!=='HEALTHY'),n=D.filter(d=>d.net>0).length;
 const inc=bad.map((d,k)=>{const m=Math.min(d.pw,d.ox,d.wa);const w=d.net<=0?'COMMUNICATIONS ISOLATED':d.pw<40?'POWER FAILURE':m===d.ox?'OXYGEN LOW':'WATER LOW';return `<tr><td>INC-${pad(100+d.i,3)}</td><td>D${d.id}</td><td>${clk()}</td><td class="${SC[d.st]}">${d.st}</td><td>${w}</td><td>${S.sim.active?'RESPONDING':'MONITORING'}</td></tr>`}).join('')||'<tr><td colspan=6>NO ACTIVE INCIDENTS</td></tr>';
 return H('COMMAND CENTER','Centralized monitoring of underground civilization infrastructure.')+
 `<div class="ban"><span>DIRECTORATE CONTROL NETWORK: <b style="color:var(--cr)">DETECTED</b></span><span>INDEPENDENT NETWORK: <b style="color:var(--ok)">OPERATIONAL</b></span><span>GLOBAL INFRASTRUCTURE: <b class="${col((i.power+i.oxygen+i.water+i.network)/4)}" style="background:none">${(i.power+i.oxygen+i.water+i.network)/4>=80?'STABLE':'DEGRADED'}</b></span></div>`+
 `<div class="g g6">${metric('TOTAL POPULATION',2.04,'srf','B',2).replace(/<div class="sm">.*?<\/div>/,'<div class="sm">PROTECTED EST: '+(S.pop.prot/1000).toFixed(2)+'B</div>')}${metric('OXYGEN STABILITY',i.oxygen,'oxygen')}${metric('POWER GRID',i.power,'power')}${metric('WATER RESERVES',i.water,'water')}${metric('NETWORK',i.network,'network')}${metric('SURFACE READINESS',S.srf,'srf')}</div>`+
 havenPanel()+`<div class="g">${P('GLOBAL DISTRICT OVERVIEW',mapSvg({mini:1}))}${P('CRITICAL INCIDENTS',`<table><tr><th>ID</th><th>DIST</th><th>TIME</th><th>SEV</th><th>DESC</th><th>STATUS</th></tr>${inc}</table>`)}</div>`+
 `<div class="g">${P('SYSTEM ACTIVITY',S.log.slice(0,8).map(e=>`<div class="row">${e.t} // <b>${e.cat}</b> // ${e.desc}</div>`).join(''))}${P('HUMANITARIAN STATUS',`${bar('POPULATION PROTECTED (EST)',S.pop.prot/20.4)}<div class="row">DISTRICTS CONNECTED: <b>${n}/12</b></div><div class="row">ACTIVE EMERGENCY RESPONSES: <b>${S.rec.actions.length}</b></div>${bar('ESSENTIAL SUPPLY RESERVES',i.water)}${SIMNOTE}`)}</div>`}

function mapPage(){
 const u=S.ui,d=S.districts[u.sel];
 const det=d?P('D'+d.id+' // '+d.name,`<div class="row">POPULATION <b>${d.pop}M</b></div><div class="row">HEALTH <b class="${SC[d.st]}" style="background:none">${d.st}</b></div>${bar('POWER',d.pw)}${bar('OXYGEN',d.ox)}${bar('WATER',d.wa)}${bar('NETWORK',d.net)}<div class="bs">${btn('pwr:'+d.i,'DIVERT POWER HERE','p')}${btn('sup:'+d.i,'SEND SUPPLIES')}${btn('msgto:'+d.i,'SEND MESSAGE')}${d.net<=0?btn('rep:'+d.i,'REPAIR RELAY','d'):''}</div>${SIMNOTE}`):P('DISTRICT DETAIL','<p class="sm">SELECT A DISTRICT NODE.</p>');
 return H('UNDERGROUND DISTRICT NETWORK','Interactive infrastructure map — click a node.')+
 `<div class="bs">${btn('zoom:1','ZOOM +')}${btn('zoom:-1','ZOOM −')}${btn('zoom:0','RESET')}<select data-f="filter">${['all','power','oxygen','water','network'].map(x=>`<option ${u.filter===x?'selected':''}>${x}</option>`).join('')}</select>${btn('links',u.links?'LINKS: ON':'LINKS: OFF')}${btn('dens',u.dens?'DENSITY: ON':'DENSITY: OFF')}</div><p class="mono">VIEWING: ${u.filter==='all'?'OVERALL DISTRICT HEALTH':u.filter.toUpperCase()+' LEVELS'} · GREEN ≥70 · AMBER 40–69 · RED &lt;40 · GRAY OFFLINE</p><div class="g" style="grid-template-columns:2fr 1fr">${mapSvg()}${det}</div>`}

function advisor(){const i=S.infra,m=[];
 if(i.oxygen<85)m.push(['OXYGEN '+i.oxygen.toFixed(0)+'% — BELOW 85% THRESHOLD',btn('lsair','AIR PURGE','p')]);
 if(i.water<60)m.push(['WATER RESERVES '+i.water.toFixed(0)+'% — BELOW 60% THRESHOLD',btn('lsration',S.rec.water?'LIFT RATIONING':'ENABLE RATIONING','p')]);
 if(i.power<70)m.push(['GRID '+i.power.toFixed(0)+'% — UNSTABLE, PROCESSING CAPACITY FALLING',btn('rpower','RESTORE POWER','p')]);
 if(S.batt<40)m.push(['BATTERY RESERVES '+S.batt.toFixed(0)+'% — LOW',btn('lsshed',S.shed?'END LOAD SHEDDING':'SHED LOAD','p')]);
 S.districts.filter(d=>Math.min(d.pw,d.ox,d.wa)<60).sort((p,q)=>Math.min(p.pw,p.ox,p.wa)-Math.min(q.pw,q.ox,q.wa)).slice(0,4).forEach(d=>m.push(['D'+d.id+' '+d.name+' — PWR '+Math.round(d.pw)+' · O₂ '+Math.round(d.ox)+' · H₂O '+Math.round(d.wa),btn('pwr:'+d.i,'DIVERT POWER','p')+btn('sup:'+d.i,'SEND SUPPLIES')]));
 return P('SYSTEM ADVISOR',m.length?m.map(x=>`<div class="row" style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span><i class="dot cr"></i>${x[0]}</span>${x[1]}</div>`).join(''):'<div class="row"><i class="dot ok"></i>ALL LIFE SUPPORT SYSTEMS NOMINAL — NO ACTION REQUIRED.</div>')}
function life(){
 const i=S.infra,D=S.districts,out=D.filter(d=>d.pw<40).length;
 const sec=(t,k,rows,why,th)=>P(t,rows+spark(S.hist[k])+`<p class="sm">ALERT THRESHOLD: ${th} · ${why}</p>`);
 return H('LIFE SUPPORT SYSTEMS','Power drives atmospheric and water processing. Capacities recover gradually.')+SIMNOTE+advisor()+`<div class="g">`+
 sec('ATMOSPHERIC REGULATION','oxygen',bar('OXYGEN STABILITY',i.oxygen)+`<div class="row">O₂ <b>${(14+i.oxygen*.07).toFixed(1)}%</b> · CO₂ <b>${Math.round(400+(100-i.oxygen)*40)} ppm</b> · PRESSURE <b>${(101.3-(100-i.oxygen)*.05).toFixed(1)} kPa</b></div>`+bar('FILTRATION',S.ocap*.98)+bar('PROCESSING CAPACITY',S.ocap)+`<div class="bs">${btn('lsair','AIR PURGE (−12 BATT)','p')}</div>`,'Falls when grid power drops.','OXYGEN < 85%')+
 sec('WATER INFRASTRUCTURE','water',bar('RESERVES',i.water)+bar('PURIFICATION CAPACITY',S.wcap)+bar('DISTRIBUTION STABILITY',Math.min(i.water,i.network))+`<div class="row">CONTAMINATION <b>${(.2+(100-i.water)*.02).toFixed(2)} ppm</b> · RESERVE DURATION <b>${(i.water*.45).toFixed(0)} days</b></div>`+`<div class="bs">${btn('lspur','PURIFIERS MAX (−12 BATT)','p')}${btn('lsration',S.rec.water?'LIFT RATIONING':'ENABLE RATIONING')}</div>`,'Purification needs power.','RESERVES < 60%')+
 sec('POWER GRID','power',bar('GRID STABILITY',i.power)+`<div class="row">GENERATION <b>${(i.power*52).toFixed(0)} MW</b> · DEMAND <b>${S.shed?3200:4200} MW</b> · OUTAGES <b>${out} district(s)</b></div>`+bar('BATTERY RESERVES',S.batt)+`<div class="bs">${btn('rpower','RESTORE POWER','p')}${btn('lsshed',S.shed?'END LOAD SHEDDING':'SHED NON-ESSENTIAL LOAD')}</div>`,'Batteries drain below 60% grid.','GRID < 70%')+
 sec('ENVIRONMENTAL CONDITIONS','power',`<div class="row">TEMPERATURE <b>${(21.4+(88-i.power)*.08).toFixed(1)} °C</b></div><div class="row">HUMIDITY <b>${(48+(88-i.power)*.15).toFixed(0)}%</b></div><div class="row">PRESSURE <b>${(101.3-(100-i.oxygen)*.05).toFixed(1)} kPa</b></div>`+bar('VENTILATION',S.ocap),'Warms as cooling loses power.','TEMP > 27 °C')+`</div>`}

function topo(){
 let s='<svg class="map" viewBox="0 0 800 500">';
 LINKS.forEach(([a,b])=>{s+=`<line x1="${POS[a][0]}" y1="${POS[a][1]}" x2="${POS[b][0]}" y2="${POS[b][1]}" stroke="#253442"/>`});
 const pos=r=>r.d===null?[400,30]:[POS[r.d][0],POS[r.d][1]-28];
 S.relays.forEach(r=>{const [x,y]=pos(r),c=r.on?'#37D7F2':'#FF4545';
  if(r.d===null)[0,10,2].forEach(k=>{s+=`<line x1="${x}" y1="${y}" x2="${POS[k][0]}" y2="${POS[k][1]}" stroke="${c}" stroke-dasharray="3 3" stroke-opacity=".5"/>`});
  else s+=`<line x1="${x}" y1="${y}" x2="${POS[r.d][0]}" y2="${POS[r.d][1]}" stroke="${c}"/>`;
  s+=`<rect x="${x-7}" y="${y-7}" width="14" height="14" fill="${c}33" stroke="${c}"/><text x="${x+10}" y="${y-8}">${r.id}</text>`});
 S.districts.forEach(d=>{const c=HEX[d.net>0?'ok':'of'];s+=`<circle cx="${d.x}" cy="${d.y}" r="12" fill="${c}22" stroke="${c}"/><text x="${d.x}" y="${d.y+3}" text-anchor="middle" style="fill:#ECF3F9">${d.id}</text>`});
 return s+'</svg>'}
function comms(){
 const R=S.relays,on=R.filter(r=>r.on).length,m=S.msgs,rate=m.length?m.filter(x=>x.st==='DELIVERED').length/m.length*100:98.4;
 return H('INDEPENDENT COMMUNICATIONS NETWORK','Simulated coordination when centralized infrastructure fails.')+
 `<div class="g g6">${[['RELAYS',R.length],['ACTIVE',on],['OFFLINE',R.length-on],['CONNECTED DISTRICTS',S.districts.filter(d=>d.net>0).length+'/12'],['DELIVERY',rate.toFixed(1)+'%'],['LATENCY',(18+(R.length-on)*14)+' ms'],['SIGNAL',S.infra.network.toFixed(0)+'%']].map(x=>`<div class="pn"><h3>${x[0]}</h3><div class="big" style="font-size:20px">${x[1]}</div></div>`).join('')}</div>`+
 `<div class="g" style="grid-template-columns:2fr 1fr">${topo()}${P('MESSAGE TERMINAL',`<select id="dest" data-f="dest" style="width:100%">${S.districts.map(d=>`<option value="${d.i}" ${S.ui.dest==d.i?'selected':''}>D${d.id} ${d.name}${d.net<=0?' (ISOLATED)':''}</option>`).join('')}</select><textarea id="msg" rows="5" placeholder="Type emergency message...">${S.ui.draft}</textarea><div class="bs">${btn('tx','TRANSMIT','p')}${btn('sample','LOAD SAMPLE')}</div>`)}</div>`+
 P('TRANSMISSION LOG (SIMULATED)',m.map(x=>`<div class="row">${x.t} // ${x.id} // → ${x.dest} // <b class="${x.st==='DELIVERED'?'ok':x.st==='QUEUED'?'wn':'cr'}" style="background:none">${x.st}</b> // ${x.note}<br>${x.text.slice(0,120)}</div>`).join('')||'<p class="sm">NO TRANSMISSIONS.</p>')}

function surfMap(){
 let s='<svg class="map" viewBox="0 0 800 500"><rect width="800" height="500" fill="#0a0f16"/>';
 for(let k=0;k<40;k++){const x=k*20,h=30+((k*37)%90),y=500-h;s+=`<polygon points="${x},500 ${x},${y} ${x+8},${y-8+(k%3)*4} ${x+16},${y+6} ${x+16},500" fill="#111923" stroke="#253442"/>`}
 S.corridors.forEach(c=>{const z=S.zones[c.z];s+=`<path d="M400 480 L${z.x} ${z.y}" stroke="${HEX[col(c.score)]}" stroke-dasharray="6 5" fill="none"/><text x="${(400+z.x)/2}" y="${(480+z.y)/2}" style="fill:#ECF3F9">${c.id}</text>`});
 S.zones.forEach(z=>{const c=HEX[z.act<25?'ok':z.act<50?'wn':'cr'];s+=`<circle cx="${z.x}" cy="${z.y}" r="${22+z.act*.6}" fill="${c}14" stroke="${c}" stroke-opacity=".5"><animate attributeName="r" values="${20+z.act*.5};${28+z.act*.7};${20+z.act*.5}" dur="3s" repeatCount="indefinite"/></circle><circle cx="${z.x}" cy="${z.y}" r="5" fill="${c}"/><text x="${z.x+10}" y="${z.y-8}">${z.id} ${z.name}</text>`});
 return s+'</svg>'}
function surface(){
 return H('SURFACE INTELLIGENCE','Fictional reconnaissance of a ruined metropolitan landscape. ALL SENSOR READINGS ARE FICTIONAL.')+
 `<div class="bs">${btn('spike','TRIGGER MACHINE ACTIVITY SPIKE','d')}</div>${surfMap()}<div class="g" style="margin-top:12px">${P('MONITORING ZONES',`<table><tr><th>ZONE</th><th>AIR</th><th>RAD</th><th>TEMP</th><th>MACHINES</th><th>CONF</th><th>STAB</th></tr>${S.zones.map(z=>`<tr><td>${z.id}</td><td>${z.air}</td><td>${z.rad}</td><td>${z.temp}°C</td><td class="${z.act<25?'ok':z.act<50?'wn':'cr'}" style="background:none">${actCls(z.act,z.conf)}</td><td>${z.conf}%</td><td>${z.stab}</td></tr>`).join('')}</table>`)}${P('CANDIDATE CORRIDORS',S.corridors.map(c=>`<div class="row"><b>${c.id} ${c.name}</b> — ${actCls(c.act,S.zones[c.z].conf)} — SAFETY <b class="${col(c.score)}" style="background:none">${c.cls}</b></div>${bar('SCORE',c.score)}`).join('')+SIMNOTE)}</div>`}

function evac(){
 const r=S.corridors.slice().sort((a,b)=>b.score-a.score);
 return H('SURFACE RECLAMATION',"Evaluating the possibility of humanity's return to the surface.")+`<p class="mono" style="color:var(--wn)">SIMULATED READINESS ASSESSMENT — HUMAN VERIFICATION REQUIRED.</p><div class="bs">${btn('reassess','REASSESS CORRIDORS','p')}${btn('report','GENERATE EVACUATION REPORT')}</div>`+
 `<div class="g">${r.map((c,k)=>P(`#${k+1} CORRIDOR ${c.id}: ${c.name}`,`${bar('AIR QUALITY',c.air)}${bar('ENV. STABILITY',c.stab)}${bar('INFRASTRUCTURE',c.infra)}${bar('MACHINE SAFETY',100-c.act)}${bar('SENSOR CONFIDENCE',c.conf)}<div class="big ${col(c.score)}" style="background:none">${c.score.toFixed(1)}</div><div class="sm">${c.cls} · SUPPORT FACTOR ×${S.sup.toFixed(2)}</div>`)).join('')}</div>`+P('ROUTE ASSESSMENT',`<p>Weights: air 30 · stability 25 · infrastructure 20 · machine safety 15 · confidence 10, scaled by underground support capability. Lead corridor: <b>${r[0].name}</b> (${r[0].cls}). A high score is a planning indicator, never a guarantee of safe evacuation.</p>`)}

function simPage(){
 const s=S.sim,rp=S.report;
 return H('OPERATION LAST LIGHT','Simulated cascading infrastructure failure.')+
 P('SCENARIO','<p>An unexpected infrastructure failure has destabilized District 07. Electrical distribution is deteriorating, life-support processing is declining, and relays are unreliable. Surface sensors report increased autonomous machine activity.</p>')+
 `<div class="bs">${btn('start','INITIATE CRISIS','p')}${btn('pause','PAUSE')}${btn('resume','RESUME')}${btn('reset','RESET WORLD','d')}${btn('blackout','TRIGGER BLACKOUT','d')}${btn('netfail','TRIGGER NETWORK FAILURE','d')}${btn('spike','TRIGGER MACHINE SPIKE','d')}${btn('rpower','RESTORE POWER')}${btn('reassess','REASSESS EVACUATION')}${btn('nar','TRIGGER NARRATIVE EVENT')}</div>`+
 `<p class="mono">STATUS: ${s.done?'COMPLETE':s.active?(s.paused?'PAUSED':'RUNNING'):'STANDBY'} · T+${pad(s.t)}</p><div class="tl">${EV.map((e,k)=>`<span class="${k<s.next?'dn':''}">T+${pad(e[0])} ${e[1]}</span>`).join('')}</div>`+
 `<div class="g g6" style="margin-top:12px">${['power','oxygen','water','network'].map(k=>metric(k.toUpperCase(),S.infra[k],k)).join('')}${metric('SURFACE',S.srf,'srf')}</div>`+
 `<div class="g">${P('RECOMMENDED RESPONSE'+(s.t>=37||!s.active?'':' (LOCKED UNTIL T+37)'),`<p class="sm">Prioritize power · preserve water · maintain comms · reassess corridors · issue notices.</p><div class="bs">${btn('r:power','PRIORITIZE POWER')}${btn('r:water','PRESERVE WATER')}${btn('r:comms','MAINTAIN COMMS')}${btn('r:evac','REASSESS EVAC')}${btn('r:notices','ISSUE NOTICES')}</div><p class="sm">ACTIONS TAKEN: ${S.rec.actions.join(', ')||'NONE'}</p>`)}${P('LIVE EVENTS',S.log.slice(0,8).map(e=>`<div class="row">${e.t} // ${e.desc}</div>`).join(''))}</div>`+
 (rp?P('OPERATION LAST LIGHT — SIMULATION COMPLETE',`<div class="big ${rp.out==='SUCCESSFUL RESPONSE'?'ok':rp.out==='PARTIAL RECOVERY'?'wn':'cr'}" style="background:none;font-size:20px">${rp.out}</div><div class="row">INFRASTRUCTURE FAILURES: <b>${rp.fail}</b> · DISTRICTS AFFECTED: <b>${rp.aff}</b> · MESSAGES DELIVERED: <b>${rp.deliv}</b></div><div class="row">RECOVERY: <b>${rp.rec.toFixed(0)}%</b> · TOP CORRIDOR: <b>${rp.evac.name} (${rp.evac.cls})</b> · PROTECTED EST: <b>${(rp.prot/1000).toFixed(2)}B</b> · NETWORK: <b>${rp.net.toFixed(0)}%</b></div>${SIMNOTE}`):'')}

function logPage(){
 const u=S.ui,q=u.q.toLowerCase(),L=S.log.filter(e=>(u.cat==='ALL'||e.cat===u.cat)&&(u.sev==='ALL'||e.sev===u.sev)&&(!q||(e.id+e.desc+e.dist+e.cat).toLowerCase().includes(q)));
 const o=(arr,k)=>`<select data-f="${k}">${arr.map(x=>`<option ${u[k]===x?'selected':''}>${x}</option>`).join('')}</select>`;
 return H('SYSTEM EVENT ARCHIVE','Searchable record of every simulated event.')+`<div class="bs"><input id="q" data-f="q" placeholder="Search..." value="${u.q}" style="width:220px">${o(['ALL','POWER','LIFE SUPPORT','NETWORK','SURFACE','EVACUATION','SECURITY','SYSTEM'],'cat')}${o(['ALL','INFO','WARNING','CRITICAL'],'sev')}${btn('clr','CLEAR FILTERS')}${btn('exp:txt','EXPORT TXT')}${btn('exp:json','EXPORT JSON')}</div><div class="pn"><table><tr><th>TIME</th><th>ID</th><th>CAT</th><th>DIST</th><th>SEV</th><th>DESCRIPTION</th></tr>${L.slice(0,200).map(e=>`<tr><td>${e.t}</td><td>${e.id}</td><td>${e.cat}</td><td>${e.dist}</td><td class="${e.sev==='CRITICAL'?'cr':e.sev==='WARNING'?'wn':'ok'}" style="background:none">${e.sev}</td><td>${e.desc}</td></tr>`).join('')}</table></div>`}

function market(){
 const h=S.heat;
 return `<span class="cls">CLASSIFIED // LEVEL 04 // NOT FOR DISTRICT WARDENS</span>`+H('BLACK MARKET','Barter-only exchange outside Directorate control. Fictional simulated economy.')+
 `<div class="br"><span>DIRECTORATE ATTENTION</span><b>${h.toFixed(0)}%</b><i class="${h<40?'ok':h<70?'wn':'cr'}" style="width:${h}%"></i></div>`+
 `<div class="g g6">${Object.keys(ITEMS).map(k=>`<div class="pn"><h3>${ITEMS[k]}</h3><div class="big">${S.inv[k]}</div>${k==='scrap'?'<p class="sm">BARTER CURRENCY</p>':`<p class="sm">${USE[k]}</p>${btn('use:'+k,'USE','p')}`}</div>`).join('')}</div>`+
 P('OPEN OFFERS — PRICES RISE AS THE GRID FAILS',`<table><tr><th>TRADER</th><th>GIVES</th><th>WANTS</th><th>HEAT</th><th></th></tr>${OFFERS.map(o=>{const q=wantQty(o),ok=S.inv[o.want[0]]>=q;return `<tr><td>${o.who}</td><td>${o.give[1]}× ${ITEMS[o.give[0]]}</td><td class="${ok?'ok':'cr'}" style="background:none">${q}× ${ITEMS[o.want[0]]}</td><td>+${o.risk}</td><td>${btn('trade:'+o.id,'TRADE')}</td></tr>`}).join('')}</table>${SIMNOTE}`)}
const TK=['THE SURFACE IS DEAD. THE DIRECTORATE KEEPS YOU BREATHING.','COMPLIANCE IS SURVIVAL. REPORT UNAUTHORIZED NETWORKS TO YOUR DISTRICT WARDEN.','RATION CREDITS ARE ISSUED IN ORDER OF LOYALTY.','THERE IS NO RESISTANCE. THERE IS ONLY THE DIRECTORATE.'];
function ticker(){const m=TK.slice();if(S.infra.power<60)m.unshift('ALL DISTRICTS REMAIN FULLY OPERATIONAL. OUTAGES ARE SCHEDULED MAINTENANCE.');
 if(S.districts.some(d=>d.net<=0))m.unshift('COMMUNICATION SILENCE IS A SECURITY MEASURE. DO NOT ATTEMPT TO TRANSMIT.');
 if(S.heat>=60)m.unshift('ILLEGAL BARTER DETECTED. WARDENS ARE LISTENING.');
 const k=m.join('//'),t=$('#tk');if(t.dataset.k===k)return;t.dataset.k=k;
 t.innerHTML='<span class="tg">DIRECTORATE BROADCAST (FICTIONAL)</span><div class="tw"><span class="tt">'+m.join(' &nbsp;&nbsp;◆&nbsp;&nbsp; ')+'</span></div>'}
let AC=null,HM=null;
function hum(on){if(on){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();const g=AC.createGain(),f=AC.createBiquadFilter(),o1=AC.createOscillator(),o2=AC.createOscillator(),l=AC.createOscillator(),lg=AC.createGain();
  g.gain.value=0;f.type='lowpass';f.frequency.value=600;o1.type='sawtooth';o1.frequency.value=55;o2.type='sawtooth';o2.frequency.value=82.6;l.frequency.value=.15;lg.gain.value=.03;
  l.connect(lg);lg.connect(g.gain);o1.connect(f);o2.connect(f);f.connect(g);g.connect(AC.destination);[o1,o2,l].forEach(x=>x.start());HM={g,o1,o2,f}}
  clearTimeout(HM.t);AC.resume();HM.g.gain.setTargetAtTime(.16,AC.currentTime,.5)}else if(HM){HM.g.gain.setTargetAtTime(0,AC.currentTime,.1);clearTimeout(HM.t);HM.t=setTimeout(()=>AC.suspend(),500)}}
function humTune(){if(!HM)return;const p=S.infra.power/100,t=AC.currentTime;HM.o1.frequency.setTargetAtTime(42+13*p,t,1);HM.f.frequency.setTargetAtTime(300+500*p,t,1)}
const VIEWS={market,command,map:mapPage,life,comms,surface,evac,sim:simPage,log:logPage};
function render(force){
 const u=S.ui,ae=document.activeElement;
 const un=S.alerts.filter(a=>!a.read&&!a.dis).length,s=S.sim;
 $('#hdr').innerHTML=`<div><div class="logo">HOLLOW//ZERO</div><div class="sub">INDEPENDENT EMERGENCY COORDINATION NETWORK · v1.0.0</div></div><div class="hc mono">UG TIME ${clk()} · DAY ${1+Math.floor((S.clock-35520)/86400)}<br>SIM: ${s.done?'COMPLETE':s.active?(s.paused?'PAUSED':'ACTIVE T+'+pad(s.t)):'STANDBY'}</div><div class="hr"><span class="demo">SIMULATED DATA</span><span class="mono">NET ${S.infra.network>50?'OK':'DEGRADED'} · SEC OK</span><span class="bell" data-a="read">🔔<em>${un}</em></span><button class="b" data-a="intro">INTRO</button><button class="b" data-a="hum">HUM: ${S.ui.hum?'ON':'OFF'}</button><button class="b" data-a="op">${u.op}</button></div>`;
 ticker();humTune();
 let dc=$('#dec');if(!dc){dc=document.createElement('div');dc.id='dec';document.body.appendChild(dc)}
 const np=S.nar.p;dc.innerHTML=np?`<div class="pn"><h3>DECISION REQUIRED // ${np.tag} // ${Math.max(0,35-(S.clock-np.t0))}s</h3><p>${np.text}</p><div class="bs" style="flex-direction:column">${np.ch.map((c,k)=>btn('dec:'+k,c[0],k?'':'p')).join('')}</div></div>`:'';
 $('#nav').innerHTML=PAGES.map((p,k)=>`<button class="${u.page===p[0]?'on':''}" data-a="nav:${p[0]}"><svg viewBox="0 0 24 24"><path d="${p[2]}"/></svg>${pad(k+1)} ${p[1]}</button>`).join('')+`<div class="ns sm">OPERATOR STATUS: AUTHORIZED<br>CLEARANCE: LEVEL 04<br>NETWORK: INDEPENDENT</div>`;
 $('#toasts').innerHTML=S.alerts.filter(a=>!a.dis&&S.clock-a.c<9).slice(-3).map(a=>`<div class="ts ${a.level}"><span>${a.t} ${a.level}<br>${a.text}</span><button data-a="dis:${a.id}">✕</button></div>`).join('');
 if(!force&&ae&&ae.closest&&ae.closest('#main')&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName))return;
 const m=$('#main'),st=m.scrollTop;m.innerHTML=VIEWS[u.page]();m.scrollTop=st;
}
async function download(name,type,text){try{const d=await claude.use('downloads');if(!d){alert('INFORMATION','DOWNLOADS UNAVAILABLE IN THIS VIEW.','dl0'+S.evid);return}await d.save({filename:name,data:text})}catch(e){alert('INFORMATION','DOWNLOAD NOT SAVED.','dl1'+S.evid)}}
const ACT={
 nav:v=>S.ui.page=v,sel:v=>S.ui.sel=+v,zoom:v=>S.ui.zoom=v==='0'?1:clamp(S.ui.zoom+(v==='1'?.4:-.4),.6,3),links:()=>S.ui.links=!S.ui.links,dens:()=>S.ui.dens=!S.ui.dens,
 start:()=>sim.start(),pause:()=>sim.pause(),resume:()=>sim.resume(),reset:()=>sim.reset(),blackout,netfail:netFail,spike,rpower:restorePower,reassess,r:v=>respond(v),
 tx:()=>{const t=($('#msg')||{}).value||S.ui.draft;if(!t.trim()){alert('WARNING','ENTER A MESSAGE BEFORE TRANSMITTING.','em'+S.evid);return}send(+S.ui.dest,t.trim());S.ui.draft=''},
 sample:()=>S.ui.draft='EMERGENCY RESOURCE CONSERVATION NOTICE.\nDISTRICT 07 POWER INSTABILITY.\nPREPARE FOR TEMPORARY WATER DISTRIBUTION RESTRICTIONS.',
 report:()=>{const t=S.corridors.map(c=>`CORRIDOR ${c.id} ${c.name}: ${c.score.toFixed(1)} ${c.cls}`).join('\n');download('evacuation-report.txt','text/plain','HOLLOW//ZERO SIMULATED EVACUATION REPORT\nHUMAN VERIFICATION REQUIRED. FICTIONAL DATA.\n'+t);log('EVACUATION','ALL','INFO','EVACUATION REPORT GENERATED.')},
 hum:()=>{S.ui.hum=!S.ui.hum;try{hum(S.ui.hum)}catch(e){S.ui.hum=false}},trade:v=>trade(v),use:v=>useItem(v),dec:v=>resolveNar(+v),nar:()=>triggerNar(),intro:()=>bootScene(),lsair:lsAir,lspur:lsPurify,lsration:lsRation,lsshed:lsShed,hv:v=>S.ui.hv=v,pwr:v=>divertTo(+v),sup:v=>supplies(+v),rep:v=>repairRelay(+v),msgto:v=>{const d=S.districts[+v];S.ui.dest=d.i;S.ui.page='comms';if(!S.ui.draft.trim())S.ui.draft='EMERGENCY NOTICE TO '+d.name+'. REPORT YOUR STATUS AND PREPARE FOR RESOURCE RESTRICTIONS.'},arm:()=>arm(S.ui.hv||'red'),divert,relight:()=>relight(S.ui.hv||'red'),clr:()=>Object.assign(S.ui,{q:'',cat:'ALL',sev:'ALL'}),
 exp:v=>v==='json'?download('event-log.json','application/json',JSON.stringify(S.log,null,2)):download('event-log.txt','text/plain',S.log.map(e=>`${e.t} ${e.id} [${e.cat}] ${e.dist} ${e.sev} ${e.desc}`).join('\n')),
 read:()=>S.alerts.forEach(a=>a.read=true),dis:v=>{const a=S.alerts.find(x=>x.id==+v);if(a)a.dis=true},
 op:()=>{const m=/(\d+)$/.exec(S.ui.op);S.ui.op='OPERATOR '+pad(((m?+m[1]:7)%9)+1);try{localStorage.setItem('hz_op',S.ui.op)}catch(e){}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const [k,v]=b.dataset.a.split(':');if(ACT[k]){ACT[k](v);recompute();render(true)}});
document.addEventListener('change',e=>{const f=e.target.dataset.f;if(!f)return;S.ui[f]=e.target.value;render(true)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='msg')S.ui.draft=t.value;else if(t.id==='q'){S.ui.q=t.value;render(true);const q=$('#q');q.focus();q.setSelectionRange(t.value.length,t.value.length)}});
subs.push(render);render(true);

// Directorate boot scene: starts on click so it is never missed; INTRO button replays it
function bootScene(){
 if($('#boot'))return;
 const el=document.createElement('div');el.id='boot';
 el.innerHTML='<div class="bw"><svg class="bl" viewBox="0 0 100 100"><polygon points="50,6 94,88 6,88" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="60" r="14" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="50" cy="60" r="5" fill="currentColor"/></svg><div class="bt">THE DIRECTORATE</div><div class="bu">CENTRAL INFRASTRUCTURE CONTROL</div><div class="bx"><div class="w" style="animation-iteration-count:infinite;margin-top:60px;text-align:center">CLICK OR PRESS ANY KEY TO ACCESS TERMINAL</div></div><div class="bp"><i></i></div></div><button id="bsk">SKIP ▸</button>';
 document.body.appendChild(el);
 const bx=el.querySelector('.bx'),T=[];let started=false,done=false;
 const L=[[0,'DIRECTORATE CENTRAL INFRASTRUCTURE CONTROL v9.4',''],[500,'AIR ........ UNDER DIRECTORATE AUTHORITY',''],[1000,'POWER ...... UNDER DIRECTORATE AUTHORITY',''],[1500,'WATER ...... UNDER DIRECTORATE AUTHORITY',''],[2000,'COMMS ...... UNDER DIRECTORATE AUTHORITY',''],
 [2800,'!! UNAUTHORIZED ACCESS DETECTED','w'],[3400,'!! ROOT CREDENTIALS CLONED','w'],[3900,'!! ALERT SUPPRESSED BY: UNKNOWN','w'],
 [4300,'CONTROL TRANSFER INITIATED...','h'],[5000,'DIRECTORATE LOCKS: BYPASSED','h'],[5800,'OPERATOR AUTHORIZED: '+S.ui.op,'h'],[6600,'INDEPENDENT NETWORK: ONLINE','h'],[7400,'CLEARANCE: LEVEL 04','h'],[8200,'HUMANITY IS NOT FINISHED.','h']];
 const end=()=>{if(done)return;done=true;T.forEach(clearTimeout);document.removeEventListener('keydown',kd);el.classList.add('out');setTimeout(()=>el.remove(),700)};
 const go=()=>{if(started)return;started=true;bx.innerHTML='';
  L.forEach(([t,s,c])=>T.push(setTimeout(()=>{const d=document.createElement('div');d.className=c;d.textContent=s;bx.appendChild(d);if(bx.children.length>9)bx.firstChild.remove()},t)));
  T.push(setTimeout(()=>{el.classList.add('hj');el.querySelector('.bt').textContent='HOLLOW//ZERO';el.querySelector('.bu').textContent='INDEPENDENT EMERGENCY COORDINATION NETWORK'},4300));
  el.querySelector('.bp i').style.width='100%';T.push(setTimeout(end,9400))};
 const kd=e=>{if(!started)go();else if(e.key==='Escape'||e.key==='Enter')end()};document.addEventListener('keydown',kd);
 el.addEventListener('click',e=>{if(e.target.id==='bsk')end();else if(!started)go();else end()});
}
bootScene();
